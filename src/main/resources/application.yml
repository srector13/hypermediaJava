spring:
  application:
    name: hypermedia-java
  datasource:
    # In-memory by default. Point this at Postgres/MySQL and both engines keep working (standard SQL only).
    url: jdbc:h2:mem:hypermedia;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always            # run schema.sql — the schema belongs to the app, not to Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        session_factory:
          statement_inspector: dev.hypermediajava.sql.SqlCapture
  h2:
    console:
      enabled: true
      path: /h2-console
  threads:
    virtual:
      enabled: true           # each SSE connection parks a virtual thread, not a platform thread
  mvc:
    format:
      date: iso               # <input type="date"> speaks yyyy-MM-dd
    async:
      request-timeout: -1

server:
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript
  http2:
    enabled: false

app:
  seed:
    count: 50000
  simulator:
    interval-ms: 1500

logging:
  level:
    dev.hypermediajava: INFO
